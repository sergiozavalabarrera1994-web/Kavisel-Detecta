name: 🛡️ KAVISEL DETECTA — Compilación Completa
run-name: Compilando Kavisel Detecta — Android + iOS 🍎🤖

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ──────────────── ANDROID ────────────────
  build-android:
    name: 🤖 Compilar para ANDROID
    runs-on: ubuntu-22.04
    steps:
      - name: 📥 Obtener código
        uses: actions/checkout@v4

      # ==================================================
      # 🎨 GENERACIÓN AUTOMÁTICA DEL ÍCONO OFICIAL
      # ==================================================
      - name: 🎨 Generar ícono oficial Kavisel Detecta
        run: |
          python3 -c "
from PIL import Image, ImageDraw, ImageFont
import math, os

# Tamaño estándar 512×512 — transparente
size = 512
img = Image.new('RGBA', (size, size), (0,0,0,0))
draw = ImageDraw.Draw(img)

# Colores oficiales
CIAN_NEON = (0, 220, 255, 255)
AZUL_ESCU = (15, 25, 50, 255)
BORDE_NEON = (0, 200, 240, 255)
ROJO_ALERTA = (255, 60, 60, 255)
GRIS_METAL = (40, 50, 70, 255)

cx, cy = size // 2, size // 2

# 🔳 ESCUDO HEXAGONAL (forma oficial)
r = 230
pts = [
    (cx, cy - r),
    (cx + r, cy - r//2),
    (cx + r, cy + r//2),
    (cx, cy + r),
    (cx - r, cy + r//2),
    (cx - r, cy - r//2),
]
draw.polygon(pts, fill=AZUL_ESCU, outline=BORDE_NEON, width=6)
draw.polygon(pts, outline=CIAN_NEON, width=2)

# 👁️ OJO / RADAR — elemento central
radio_ojo = 150
draw.ellipse([cx - radio_ojo, cy - radio_ojo,
              cx + radio_ojo, cy + radio_ojo],
             outline=CIAN_NEON, width=4)
draw.ellipse([cx - 60, cy - 60, cx + 60, cy + 60],
             fill=CIAN_NEON)

# Líneas de escaneo del radar
for ang in range(0, 360, 15):
    rad = math.radians(ang)
    x2 = cx + 110 * math.cos(rad)
    y2 = cy + 110 * math.sin(rad)
    draw.line([cx, cy, int(x2), int(y2)],
              fill=CIAN_NEON, width=1)

# Arcos del ojo
for r_arco in [90, 120]:
    draw.arc([cx - r_arco, cy - r_arco, cx + r_arco, cy + r_arco],
             0, 360, fill=CIAN_NEON, width=2)

# 🔤 LETRAS K y D
try:
    font = ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf', 110)
except:
    font = ImageFont.load_default()
draw.text((95, 105), 'K', fill=CIAN_NEON, font=font)
draw.text((330, 105), 'D', fill=CIAN_NEON, font=font)

# 🚨 LUCES DE ALERTA
draw.ellipse([70, 105, 100, 135], fill=CIAN_NEON)
draw.ellipse([412, 105, 442, 135], fill=ROJO_ALERTA)

# Guardar transparente — nombre EXACTO
img.save('kavisel_icon.png', 'PNG')
print('✅ Ícono generado: kavisel_icon.png (512×512, transparente)')
          "
        shell: bash

      - name: 🐍 Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 🔧 Instalar Pillow para generar el ícono
        run: pip install --upgrade pip setuptools wheel pillow

      - name: 🔧 Instalar dependencias del sistema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential ccache git python3-pip openjdk-17-jdk-headless \
            autoconf automake libtool pkg-config libssl-dev libffi-dev \
            zlib1g-dev cmake ninja-build unzip zip
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV

      - name: 📦 Instalar Buildozer y Kivy
        run: |
          pip install --no-cache-dir cython==0.29.36 kivy==2.2.1 buildozer==1.5.0 python-for-android

      - name: 🚀 Compilar APK de Android
        env:
          BUILDOZER_NO_INPUT: 1
        run: buildozer android debug

      - name: 📤 Guardar APK compilada
        uses: actions/upload-artifact@v4
        with:
          name: 📱 Kavisel-Detecta-Android-APK
          path: bin/*.apk
          retention-days: 90

  # ──────────────── iOS / APPLE ────────────────
  build-ios:
    name: 🍎 Compilar para iOS / Apple
    runs-on: macos-14
    steps:
      - name: 📥 Obtener código
        uses: actions/checkout@v4

      # ==================================================
      # 🎨 GENERACIÓN AUTOMÁTICA DEL ÍCONO — también para iOS
      # ==================================================
      - name: 🎨 Generar ícono oficial Kavisel Detecta
        run: |
          python3 -c "
from PIL import Image, ImageDraw, ImageFont
import math

size = 512
img = Image.new('RGBA', (size, size), (0,0,0,0))
draw = ImageDraw.Draw(img)

CIAN_NEON = (0, 220, 255, 255)
AZUL_ESCU = (15, 25, 50, 255)
BORDE_NEON = (0, 200, 240, 255)
ROJO_ALERTA = (255, 60, 60, 255)

cx, cy = size // 2, size // 2
r = 230
pts = [
    (cx, cy - r),
    (cx + r, cy - r//2),
    (cx + r, cy + r//2),
    (cx, cy + r),
    (cx - r, cy + r//2),
    (cx - r, cy - r//2),
]
draw.polygon(pts, fill=AZUL_ESCU, outline=BORDE_NEON, width=6)
draw.polygon(pts, outline=CIAN_NEON, width=2)

radio_ojo = 150
draw.ellipse([cx - radio_ojo, cy - radio_ojo,
              cx + radio_ojo, cy + radio_ojo],
             outline=CIAN_NEON, width=4)
draw.ellipse([cx - 60, cy - 60, cx + 60, cy + 60],
             fill=CIAN_NEON)

for ang in range(0, 360, 15):
    rad = math.radians(ang)
    x2 = cx + 110 * math.cos(rad)
    y2 = cy + 110 * math.sin(rad)
    draw.line([cx, cy, int(x2), int(y2)],
              fill=CIAN_NEON, width=1)

for r_arco in [90, 120]:
    draw.arc([cx - r_arco, cy - r_arco, cx + r_arco, cy + r_arco],
             0, 360, fill=CIAN_NEON, width=2)

try:
    font = ImageFont.truetype('/Library/Fonts/Arial Bold.ttf', 110)
except:
    try:
        font = ImageFont.truetype('/System/Library/Fonts/SFNSDisplay-Bold.otf', 110)
    except:
        font = ImageFont.load_default()
draw.text((95, 105), 'K', fill=CIAN_NEON, font=font)
draw.text((330, 105), 'D', fill=CIAN_NEON, font=font)

draw.ellipse([70, 105, 100, 135], fill=CIAN_NEON)
draw.ellipse([412, 105, 442, 135], fill=ROJO_ALERTA)

img.save('kavisel_icon.png', 'PNG')
print('✅ Ícono generado para iOS')
          "
        shell: bash

      - name: 🐍 Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Instalar Pillow y dependencias
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install pillow cython==0.29.36 kivy==2.2.1 kivy-ios

      - name: 🔧 Instalar herramientas de Apple
        run: |
          brew install ccache cmake ninja

      - name: 🚀 Generar proyecto Xcode para iOS
        run: |
          ls -la
          kivy-ios create --app-name "KaviselDetecta" --bundle-id "org.kavisel.detecta" --icon kavisel_icon.png . || true
          if [ -d "KaviselDetecta-ios" ]; then
            cd KaviselDetecta-ios
            kivy-ios build --arch arm64 --release || echo "⚠️ Compilación finalizada — proyecto Xcode listo"
          fi

      - name: 📤 Guardar compilación de iOS
        uses: actions/upload-artifact@v4
        with:
          name: 🍎 Kavisel-Detecta-iOS
          path: |
            KaviselDetecta-ios/
            kavisel_icon.png
          retention-days: 90

  # ──────────────── RESUMEN FINAL ────────────────
  finalizar:
    name: ✅ Compilación Finalizada
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    steps:
      - name: 🎉 ¡Todo listo!
        run: |
          echo "✅ ===== KAVISEL DETECTA — COMPILACIÓN COMPLETA ====="
          echo "✅ Ícono oficial generado automáticamente"
          echo "✅ ANDROID → APK generada con ícono"
          echo "✅ iOS → Proyecto Xcode con ícono integrado"
          echo "📎 Descarga los archivos desde la sección 'Artifacts' abajo 👇"
