name: 🛡️ KAVISEL DETECTA — Compilación Completa
run-name: 🚀 Generando Kavisel Detecta — Ícono + Android

on:
  push:
    branches: [ main, master, principal ]
  workflow_dispatch:

jobs:
  construir-todo:
    name: 🔨 Generar App + Ícono + Compilar
    runs-on: ubuntu-22.04
    steps:
      - name: 📥 Obtener código
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 🔧 Instalar Pillow para generar ícono
        run: pip install --upgrade pip setuptools wheel pillow

      - name: 🎨 Generar ícono oficial Kavisel Detecta
        run: |
          python3 -c "
from PIL import Image, ImageDraw, ImageFont
import math
size = 512
img = Image.new('RGBA', (size, size), (0,0,0,0))
draw = ImageDraw.Draw(img)
CIAN = (0, 220, 255, 255)
AZUL = (15, 25, 50, 255)
BORDE = (0, 200, 240, 255)
ROJO = (255, 60, 60, 255)
cx, cy = 256, 256
r = 230
pts = [
    (cx, cy - r), (cx + r, cy - r//2),
    (cx + r, cy + r//2), (cx, cy + r),
    (cx - r, cy + r//2), (cx - r, cy - r//2)
]
draw.polygon(pts, fill=AZUL, outline=BORDE, width=6)
draw.polygon(pts, outline=CIAN, width=2)
draw.ellipse([cx-150, cy-150, cx+150, cy+150], outline=CIAN, width=4)
draw.ellipse([cx-60, cy-60, cx+60, cy+60], fill=CIAN)
for ang in range(0, 360, 15):
    rad = math.radians(ang)
    x = cx + 110*math.cos(rad)
    y = cy + 110*math.sin(rad)
    draw.line([cx, cy, int(x), int(y)], fill=CIAN, width=1)
try:
    f = ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf', 110)
except:
    f = ImageFont.load_default()
draw.text((95, 105), 'K', fill=CIAN, font=f)
draw.text((330, 105), 'D', fill=CIAN, font=f)
draw.ellipse([70, 105, 100, 135], fill=CIAN)
draw.ellipse([412, 105, 442, 135], fill=ROJO)
img.save('kavisel_icon.png', 'PNG')
print('✅ Ícono generado')
          "
        shell: bash

      - name: 📦 Instalar dependencias del sistema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential ccache git python3-pip openjdk-17-jdk-headless autoconf automake libtool cmake ninja-build unzip
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV
          pip install cython==0.29.36 kivy==2.2.1 buildozer==1.5.0

      - name: 🚀 Compilar APK de Android
        env:
          BUILDOZER_NO_INPUT: 1
        run: buildozer android debug

      - name: 📤 Guardar APK compilada
        uses: actions/upload-artifact@v4
        with:
          name: 📱 Kavisel-Detecta-APK
          path: bin/*.apk
          retention-days: 90
